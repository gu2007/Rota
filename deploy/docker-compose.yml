# PostgreSQL 16 em container, só acessível de dentro do servidor (127.0.0.1).
# Subir:  docker compose -f deploy/docker-compose.yml --env-file .env up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: rota-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdados:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdados:
